# Default values for wandb.
image:
  repository: wandb/local
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Required for production environments
license: eyJhbGciOiJSUzI1NiIsImtpZCI6InUzaHgyQjQyQWhEUXM1M0xQY09yNnZhaTdoSlduYnF1bTRZTlZWd1VwSWM9In0..cCJHm00u7hs_kP4NoDERV_U06Zpe1FefsoYXuGrmFEZoHXSbFlizwWAiBFCPuvC60lvfgb5HVUjzH_ICR62UhrZ7AbV55gJI_ficS7JpQd5srIgqQj-cDWHoFq7fqOYHW0JAJ5WxUmR5b5Z7fKeoisq64lsIfqhutmOcbZy6z9qoOtrarMdfxOu_ZdjnjJ0ScbpA2Shxl7kq-NnaTin2BoWGG7SHviPOHsgsig89inuxTDom8YhrRsjeVGru5frlc45lUwg_ZZ1roGCwpMT3uZOAYPFzke1GgccQ8HYQcUBFt7fqIiXbdEyYuQZCnXgADaokU2hTL8x6hYX9syY1IQ
# If set to true we'll provision an admin user and allow admin api access
enableAdminApi: false
# If using S3 be sure the pod has valid IAM creds, if using minio
# you can include the creds in the bucket url, i.e.
# !!! Be sure to use the externally accessible host / ingress,
# not the internal service
# s3://$ACCESS_KEY_ID:$SECRET_KEY@$HOST/$BUCKET?tls=true
bucket: s3://wandb-artifacts-prod-joshross
bucketRegion: eu-west-1
# If you use a custom KMS key for bucket encryption specify the arn here
bucketKmsKeyArn:
# We use sendgrid.com by default to send emails, but you can specify your own smtp server
smtpServer:
# when setting up an ingress, set this to http://domain.com or https://domain.com
host: https://wandb.joshuasross.com
# If using an external Redis instance
redis:
# If you aren't connected to an external bucket and want to mount a custom claim for minio
existingClaim:

# set additional env variables
extraEnv:
# - name: AWS_SECRET_ACCESS_KEY
#   value: XXX

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Set to false in case you rely on externally created secrets e.g. when using Sealed Secrets
createSecrets: true

# dns hostAliases, generally only used in development
hostAliases: []
# Custom CA's to make SSL verification work for self signed certs
# You'll likely want to use `--set-file customCACerts={/path/to/rootCA.crt}`
customCACerts: []

serviceAccount:
  create: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 0
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 0

service:
  type: ClusterIP
  port: 8080

sso:
  enabled: false
  # Automatically provision a user if SSO auth succeeds
  autoProvision: true
  issuer:
  # Can be implicit or pkce
  method: implicit
  clientId:
  # Optional, only if your IDP requires it
  clientSecret:

# LDAP SSO configuration
ldap:
  enabled: false
  # LDAP server address including "ldap://" or "ldaps://"
  host:
  # LDAP search base to use for finding users
  baseDN:
  # LDAP user to bind with (if not using anonymous bind)
  bindDN:
  # Secret name and key with LDAP password to bind with (if not using anonymous bind)
  bindPW:
  # LDAP attribute for email and group ID attribute names as comma separated string values.
  attributes:
  # LDAP group allow list
  groupAllowList:
  # Enable LDAP TLS
  tls: false
  # ConfigMap name and key with CA certificate for LDAP server
  tlsCert:
    configMap:
      name:
      key:

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:733153951702:certificate/879924cc-4e6b-4df8-b6f5-22a512be82d5
  hosts:
    - host: wandb.joshuasross.com
      paths:
        - path: /
          pathType: ImplementationSpecific
        - path: /console
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  # Set this to false if you want to bring your own mysql
  managed: false
  # If you have an existing mysql host, specify the host, user, and password here
  host: wandb-mysql.choe02qeeova.eu-west-1.rds.amazonaws.com
  user: wandb
  database: wandb
  password: ""
  passwordSecret:
    name: wandb-db
    passwordKey: password
  command:
  image:
    pullPolicy: IfNotPresent
    repository: mysql/mysql-server
    tag: "8.0"
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  service:
    ## Specify a service type
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services---service-types
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    ## database data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    # storageClass: "-"
    accessMode: ReadWriteOnce
    size: 64Gi
    # If you want to re-use an existing pv claim
    existingClaim:
    annotations: {}

console:
  install: true
  deploymentPostfix: "bc"
  service:
    enabled: true
    type: ClusterIP
    loadBalancerHealthCheckPath: "/console/api/healthz"
    ports:
      - port: 8082
        protocol: TCP
        name: console
  image:
    repository: wandb/console
    tag: latest
  envFrom:
    "{{ .Release.Name }}-console-configmap": "configMapRef"
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
    debug: false
  containers:
    console:
      ports:
        - name: http
          containerPort: 8082
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /console/api/healthz
          port: http
      readinessProbe:
        httpGet:
          path: /console/api/ready
          port: http
        initialDelaySeconds: 20
        periodSeconds: 5
      startupProbe:
        httpGet:
          path: /console/api/ready
          port: http
        initialDelaySeconds: 20
        periodSeconds: 5
        failureThreshold: 120
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
  role:
    create: true
    type: ClusterRole
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch", "patch", "create"]
      - apiGroups: [""]
        resources:
          [
            "namespaces",
            "pods",
            "pods/log",
            "configmaps",
            "services",
            "serviceaccounts",
            "events",
          ]
        verbs: ["get", "list"]
      - apiGroups: ["apps"]
        resources:
          [
            "deployments",
            "statefulsets",
            "daemonsets",
            "replicasets",
            "controllerrevisions",
          ]
        verbs: ["get", "list"]
      - apiGroups: ["apps"]
        resources:
          [
            "deployments/status",
            "statefulsets/status",
            "daemonsets/status",
            "replicasets/status",
          ]
        verbs: ["get"]
      - apiGroups: ["apps.wandb.com"]
        resources: ["weightsandbiases"]
        verbs: ["get"]

metric-observer:
  install: false
  image:
    repository: wandb/megabinary
    tag: latest
  pubsub:
    subscription: ""
  kafka:
    # metric-observer and flat-run-field-updater use different consumer group id on same topic
    consumerGroupId: "metric-observer"
  env:
    GORILLA_RUN_UPDATE_SHADOW_QUEUE_SUBSCRIPTIONS_METRIC_OBSERVER:
      value: '{{ include "wandb.runUpdateShadowQueue" . }}'
    GORILLA_METRIC_OBSERVER_STORE:
      value: '{{ include "wandb.redis.connectionString" . | trim }}'
  envFrom:
    "{{ .Release.Name }}-bucket-configmap": "configMapRef"
    "{{ .Release.Name }}-kafka-configmap": "configMapRef"
    "{{ .Release.Name }}-redis-configmap": "configMapRef"
    "{{ .Release.Name }}-global-configmap": "configMapRef"
    "{{ .Release.Name }}-global-secret": "secretRef"
    "{{ .Release.Name }}-flat-run-fields-updater-configmap": "configMapRef"
  envTpls:
    - '{{ include "wandb.downwardEnvs" . }}'
    - '{{ include "wandb.bucket.cwIdentity" . }}'
    - '{{ include "wandb.bucketEnvs" . }}'
    - '{{ include "wandb.mysqlEnvs" . }}'
    - '{{ include "wandb.redisEnvs" . }}'
    - '{{ include "wandb.queueEnvs" . }}'
    - '{{ include "wandb.historyStoreEnvs" . }}'
    - '{{ include "wandb.observabilityEnvs" . }}'
    - '{{ include "wandb.statsigEnvs" . }}'
    - '{{ include "wandb.license" . }}'
  containers:
    metric-observer:
      args: ["metric-observer"]
      env: {}
      envFrom: {}
      volumeMounts:
        - name: wandb-ca-certs
          mountPath: /usr/local/share/ca-certificates/inline
        - name: wandb-ca-certs-user
          mountPath: /usr/local/share/ca-certificates/configmap
        - name: redis-ca
          mountPath: /etc/ssl/certs/redis_ca.pem
          subPath: redis_ca.pem
  role:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get"]
  volumes:
    - name: wandb-ca-certs
      configMap:
        name: "{{ .Release.Name }}-ca-certs"
    - name: wandb-ca-certs-user
      configMap:
        name: '{{ .Values.global.caCertsConfigMap | default "noCertProvided" }}'
        optional: true
    - name: redis-ca
      secret:
        secretName: '{{ include "wandb.redis.passwordSecret" . }}'
        items:
          - key: REDIS_CA_CERT
            path: redis_ca.pem
        optional: true
  size: ""
  sizing:
    default:
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 3
          minReplicas: 1
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
    # Base on flat-run-fields-updater sizing with less replicas.
    # minReplicas increase by 2 instead of 3
    # maxReplicas increase by 4 instead of 5.
    small:
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 4
          minReplicas: 1
    medium:
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 8
          minReplicas: 2
    large:
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 3Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 12
          minReplicas: 4
    xlarge:
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 6Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 16
          minReplicas: 6
    xxlarge:
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 6Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 20
          minReplicas: 8

parquet:
  install: true
  deploymentPostfix: "bc"
  image:
    repository: wandb/megabinary
    tag: latest
  service:
    enabled: true
    ports:
      - port: 8087
        protocol: TCP
        name: parquet
  fuse:
    enabled: false
    resources:
      requests:
        cpu: 1
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
        ephemeral-storage: 10Gi
    fileCacheCapacity: 9.5Gi
  envFrom:
    "{{ .Release.Name }}-bucket-configmap": "configMapRef"
    "{{ .Release.Name }}-redis-configmap": "configMapRef"
    "{{ .Release.Name }}-kafka-configmap": "configMapRef"
    "{{ .Release.Name }}-global-configmap": "configMapRef"
    "{{ .Release.Name }}-global-secret": "secretRef"
    "{{ .Release.Name }}-parquet-configmap": "configMapRef"
  envTpls:
    - '{{ include "wandb.downwardEnvs" . }}'
    - '{{ include "wandb.bucket.cwIdentity" . }}'
    - '{{ include "wandb.bucketEnvs" . }}'
    - '{{ include "wandb.mysqlEnvs" . }}'
    - '{{ include "wandb.redisEnvs" . }}'
    - '{{ include "wandb.queueEnvs" . }}'
    - '{{ include "wandb.historyStoreEnvs" . }}'
    - '{{ include "wandb.observabilityEnvs" . }}'
    - '{{ include "wandb.statsigEnvs" . }}'
    - '{{ include "wandb.license" . }}'
  podAnnotationsTpls:
    - '{{ include "wandb.gcsFuseAnnotations" . }}'
  containers:
    parquet:
      args: ["parquet"]
      ports:
        - name: parquet
          containerPort: 8087
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8087
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 3
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /ready
          port: 8087
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 3
        successThreshold: 1
      volumeMountsTpls:
        - '{{ include "wandb.caCertsVolumeMounts" . }}'
        - '{{ include "wandb.gcsFuseVolumeMounts" . }}'
  cronJobs:
    parquet-backfill:
      enabled: false
      containers:
        backfill-job:
          args: ["glue"]
          env:
            GORILLA_GLUE_EXECUTE: "true"
            GORILLA_GLUE_EXECUTE_TASK_NAME: "EXPORTHISTORYTOPARQUET"
          envFrom:
            "{{ .Release.Name }}-glue-configmap": "configMapRef"
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMountsTpls:
            - '{{ include "wandb.caCertsVolumeMounts" . }}'
      concurrencyPolicy: Forbid
      schedule: "* * * * *"
      volumesTpls:
        - '{{ include "wandb.caCertsVolumes" . }}'
  volumesTpls:
    - '{{ include "wandb.caCertsVolumes" . }}'
    - '{{ include "wandb.gcsFuseVolumes" . }}'
  size: ""
  sizing:
    small:
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
        requests:
          cpu: "1"
          memory: 8Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    medium:
      resources:
        limits:
          cpu: "15"
          memory: 64Gi
        requests:
          cpu: "15"
          memory: 64Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    large:
      resources:
        limits:
          cpu: "15"
          memory: 64Gi
        requests:
          cpu: "15"
          memory: 64Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    # At larger t-shirt sizes, reserve an entire node for parquet.
    xlarge:
      resources:
        limits:
          cpu: "15"
          memory: 64Gi
        requests:
          cpu: "15"
          memory: 64Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 3
          minReplicas: 2
    xxlarge:
      resources:
        limits:
          cpu: "15"
          memory: 64Gi
        requests:
          cpu: "15"
          memory: 64Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 4
          minReplicas: 2

weave:
  install: true
  deploymentPostfix: "bc"
  cache:
    intervalInHours: 24
    size: 20Gi
    medium: ""
  image:
    repository: wandb/weave-python
    tag: latest
  service:
    enabled: true
    ports:
      - port: 9994
        protocol: TCP
        name: weave
  envFrom:
    "{{ .Release.Name }}-weave-configmap": "configMapRef"
  containers:
    weave:
      ports:
        - name: http
          containerPort: 9994
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /__weave/hello
          port: http
      readinessProbe:
        httpGet:
          path: /__weave/hello
          port: http
      startupProbe:
        httpGet:
          path: /__weave/hello
          port: http
        failureThreshold: 12
        periodSeconds: 10
      volumeMounts:
        - name: temp-dir
          mountPath: /tmp/
        - name: cache
          mountPath: /vol/weave/cache
      volumeMountsTpls:
        - '{{ include "wandb.caCertsVolumeMounts" . }}'
    weave-cache-clear:
      command:
        - python
        - weave-public/weave_query/scripts/clear_cache.py
      resources:
        limits:
          cpu: 4
          memory: 12Gi
        requests:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: temp-dir
          mountPath: /tmp/
        - name: cache
          mountPath: /vol/weave/cache
  volumes:
    - name: temp-dir
      emptyDir: {}
    - name: cache
      emptyDir:
        sizeLimit: "{{ .Values.cache.size }}"
        medium: "{{ .Values.cache.medium }}"
  volumesTpls:
    - '{{ include "wandb.caCertsVolumes" . }}'
  size: ""
  sizing:
    small:
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
        requests:
          cpu: "1"
          memory: 8Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    medium:
      resources:
        limits:
          cpu: "4"
          memory: 32Gi
        requests:
          cpu: "2"
          memory: 24Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 3
          minReplicas: 2
    large:
      resources:
        limits:
          cpu: "4"
          memory: 32Gi
        requests:
          cpu: "3"
          memory: 24Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 4
          minReplicas: 2
    xlarge:
      resources:
        limits:
          cpu: "4"
          memory: 32Gi
        requests:
          cpu: "3"
          memory: 24Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 5
          minReplicas: 2
    xxlarge:
      resources:
        limits:
          cpu: "4"
          memory: 64Gi
        requests:
          cpu: "3"
          memory: 48Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 6
          minReplicas: 2

prometheus:
  install: true

  instance:
    install: true

  redis-exporter:
    install: true

  mysql-exporter:
    install: true