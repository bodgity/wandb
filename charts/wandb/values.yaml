# Default values for wandb.
image:
  repository: wandb/local
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Required for production environments
license: eyJhbGciOiJSUzI1NiIsImtpZCI6InUzaHgyQjQyQWhEUXM1M0xQY09yNnZhaTdoSlduYnF1bTRZTlZWd1VwSWM9In0..cCJHm00u7hs_kP4NoDERV_U06Zpe1FefsoYXuGrmFEZoHXSbFlizwWAiBFCPuvC60lvfgb5HVUjzH_ICR62UhrZ7AbV55gJI_ficS7JpQd5srIgqQj-cDWHoFq7fqOYHW0JAJ5WxUmR5b5Z7fKeoisq64lsIfqhutmOcbZy6z9qoOtrarMdfxOu_ZdjnjJ0ScbpA2Shxl7kq-NnaTin2BoWGG7SHviPOHsgsig89inuxTDom8YhrRsjeVGru5frlc45lUwg_ZZ1roGCwpMT3uZOAYPFzke1GgccQ8HYQcUBFt7fqIiXbdEyYuQZCnXgADaokU2hTL8x6hYX9syY1IQ
# If set to true we'll provision an admin user and allow admin api access
enableAdminApi: false
# If using S3 be sure the pod has valid IAM creds, if using minio
# you can include the creds in the bucket url, i.e.
# !!! Be sure to use the externally accessible host / ingress,
# not the internal service
# s3://$ACCESS_KEY_ID:$SECRET_KEY@$HOST/$BUCKET?tls=true
bucket: s3://wandb-artifacts-prod-joshross
bucketRegion: eu-west-1
# If you use a custom KMS key for bucket encryption specify the arn here
bucketKmsKeyArn:
# We use sendgrid.com by default to send emails, but you can specify your own smtp server
smtpServer:
# when setting up an ingress, set this to http://domain.com or https://domain.com
host: https://wandb.joshuasross.com
# If using an external Redis instance
redis:
# If you aren't connected to an external bucket and want to mount a custom claim for minio
existingClaim:

# set additional env variables
extraEnv:
# - name: AWS_SECRET_ACCESS_KEY
#   value: XXX

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Set to false in case you rely on externally created secrets e.g. when using Sealed Secrets
createSecrets: true

# dns hostAliases, generally only used in development
hostAliases: []
# Custom CA's to make SSL verification work for self signed certs
# You'll likely want to use `--set-file customCACerts={/path/to/rootCA.crt}`
customCACerts: []

serviceAccount:
  create: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 0
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 0

service:
  type: ClusterIP
  port: 8080

sso:
  enabled: false
  # Automatically provision a user if SSO auth succeeds
  autoProvision: true
  issuer:
  # Can be implicit or pkce
  method: implicit
  clientId:
  # Optional, only if your IDP requires it
  clientSecret:

# LDAP SSO configuration
ldap:
  enabled: false
  # LDAP server address including "ldap://" or "ldaps://"
  host:
  # LDAP search base to use for finding users
  baseDN:
  # LDAP user to bind with (if not using anonymous bind)
  bindDN:
  # Secret name and key with LDAP password to bind with (if not using anonymous bind)
  bindPW:
  # LDAP attribute for email and group ID attribute names as comma separated string values.
  attributes:
  # LDAP group allow list
  groupAllowList:
  # Enable LDAP TLS
  tls: false
  # ConfigMap name and key with CA certificate for LDAP server
  tlsCert:
    configMap:
      name:
      key:

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:733153951702:certificate/058b8578-45c1-48c6-b82a-937571a93b4f
  hosts:
    - host: wandb.joshuasross.com
      paths:
        - path: /
          pathType: ImplementationSpecific
        - path: /console
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  # Set this to false if you want to bring your own mysql
  managed: false
  # If you have an existing mysql host, specify the host, user, and password here
  host: wandb-mysql.choe02qeeova.eu-west-1.rds.amazonaws.com
  user: wandb
  database: wandb
  password: ""
  passwordSecret:
    name: wandb-db
    passwordKey: password
  command:
  image:
    pullPolicy: IfNotPresent
    repository: mysql/mysql-server
    tag: "8.0"
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  service:
    ## Specify a service type
    ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services---service-types
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    ## database data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    # storageClass: "-"
    accessMode: ReadWriteOnce
    size: 64Gi
    # If you want to re-use an existing pv claim
    existingClaim:
    annotations: {}

console:
  install: true
  deploymentPostfix: "bc"
  service:
    enabled: true
    type: ClusterIP
    loadBalancerHealthCheckPath: "/console/api/healthz"
    ports:
      - port: 8082
        protocol: TCP
        name: console
  image:
    repository: wandb/console
    tag: latest
  envFrom:
    "{{ .Release.Name }}-console-configmap": "configMapRef"
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""
    debug: false
  containers:
    console:
      ports:
        - name: http
          containerPort: 8082
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /console/api/healthz
          port: http
      readinessProbe:
        httpGet:
          path: /console/api/ready
          port: http
        initialDelaySeconds: 20
        periodSeconds: 5
      startupProbe:
        httpGet:
          path: /console/api/ready
          port: http
        initialDelaySeconds: 20
        periodSeconds: 5
        failureThreshold: 120
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"

api:
  service:
    enabled: true
    loadBalancerHealthCheckPath: "/ready"
    type: ClusterIP
    ports:
      - port: 8081
        targetPort: api
        protocol: TCP
        name: http
  env:
    GORILLA_COREWEAVE_OBSERVABILITY_API_KEY:
      valueFrom:
        secretKeyRef:
          name: "gorilla-coreweave-observability"
          key: "GORILLA_COREWEAVE_OBSERVABILITY_API_KEY"
          optional: true
  envFrom:
    "{{ .Release.Name }}-bucket-configmap": "configMapRef"
    "{{ .Release.Name }}-redis-configmap": "configMapRef"
    "{{ .Release.Name }}-kafka-configmap": "configMapRef"
    "{{ .Release.Name }}-global-configmap": "configMapRef"
    "{{ .Release.Name }}-global-secret": "secretRef"
    "{{ .Release.Name }}-api-configmap": "configMapRef"
    "{{ .Release.Name }}-gorilla-session-key": "secretRef"
  envTpls:
    - '{{ include "wandb.downwardEnvs" . }}'
    - '{{ include "wandb.bucket.cwIdentity" . }}'
    - '{{ include "wandb.bucketEnvs" . }}'
    - '{{ include "wandb.mysqlEnvs" . }}'
    - '{{ include "wandb.redisEnvs" . }}'
    - '{{ include "wandb.queueEnvs" . }}'
    - '{{ include "wandb.historyStoreEnvs" . }}'
    - '{{ include "wandb.statsigEnvs" . }}'
    - '{{ include "wandb.observabilityEnvs" . }}'
    - '{{ include "wandb.oidcEnvs" . }}'
    - '{{ include "wandb.license" . }}'
    - '{{ include "wandb.rateLimitEnvs" . }}'
  initContainers:
    init-db:
      image:
        repository: wandb/local
        tag: latest
      command:
        [
          "bash",
          "-c",
          'until mysql -h$MYSQL_HOST -u$MYSQL_USER -p"$(python -c "import sys; from urllib import parse; print(parse.unquote_plus(sys.argv[1]))" $MYSQL_PASSWORD)" -D$MYSQL_DATABASE -P$MYSQL_PORT --execute="SELECT 1"; do echo waiting for db; sleep 2; done',
        ]
    migrate-db:
      command:
        [
          "bash",
          "-c",
          "./megabinary migrate --db=$GORILLA_METADATA_STORE --runs-db=$GORILLA_RUN_STORE || true; ./megabinary migrate --db=$GORILLA_METADATA_STORE --usage-db=$GORILLA_USAGE_STORE || true",
        ]
  containers:
    api:
      args: ["gorilla"]
      env: {}
      envFrom: {}
      ports:
        - name: api
          containerPort: 8081
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 30
        periodSeconds: 5
        timeoutSeconds: 1
        successThreshold: 1
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /ready
          port: api
        periodSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      volumeMountsTpls:
        - '{{ include "wandb.caCertsVolumeMounts" . }}'
  image:
    repository: wandb/megabinary
    tag: latest
  role:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "create", "update", "delete"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get"]
  volumesTpls:
    - '{{ include "wandb.caCertsVolumes" . }}'
  size: ""
  sizing:
    small:
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 2Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    medium:
      resources:
        limits:
          cpu: "6"
          memory: 16Gi
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    large:
      resources:
        limits:
          cpu: "6"
          memory: 16Gi
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    xlarge:
      resources:
        limits:
          cpu: "6"
          memory: 16Gi
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2
    xxlarge:
      resources:
        limits:
          cpu: "6"
          memory: 16Gi
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          enabled: true
          maxReplicas: 2
          minReplicas: 2