apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wandb-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: "https://github.com/bodgity/wandb.git"
    targetRevision: HEAD
    path: charts/manifest
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: wandb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
