apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wandb-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/bodgity/wandb.git"
    targetRevision: "official"
    path: "charts/wandb"
    helm:
      releaseName: wandb
      values: |
        global:
          host: "wandb.joshuasross.com"
          bucket:
            name: "wandb-artifacts-prod-joshross"
            region: "eu-west-1"
          mysql:
          host: wandb-mysql.choe02qeeova.eu-west-1.rds.amazonaws.com
          port: 3306
          database: wandb
          user: wandb
          passwordSecret:
            name: wandb-db
            passwordKey: password
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: wandb-cr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
