apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wandb-parent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/bodgity/wandb.git"
    targetRevision: HEAD
    path: "app-of-apps/apps"
    directory:
      recurse: true          # look for multiple apps in this folder
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd       # can be same as parent or different
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
