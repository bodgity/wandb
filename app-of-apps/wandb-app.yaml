apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wandb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/bodgity/wandb.git"
    targetRevision: "official"
    path: "charts/operator-wandb"       # look for multiple apps in this folder
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: wandb-cr       # can be same as parent or different
  syncPolicy:
    automated:
      prune: true
      selfHeal: true